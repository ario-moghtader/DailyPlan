<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه‌ریزی شخصی من</title>
    <style>
        /* استایل‌ها همانند قبل باقی می‌مانند */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', Tahoma, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .creator {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .calendar-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .tasks-section {
            flex: 2;
            min-width: 300px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .calendar-nav {
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
            background: #4c6ef5;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .nav-btn:hover {
            background: #3b5bdb;
            transform: scale(1.1);
        }
        
        .current-month {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3b5bdb;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #495057;
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            position: relative;
            flex-direction: column;
            padding: 2px;
        }
        
        .day:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }
        
        .current-day {
            background: #4c6ef5;
            color: white;
            font-weight: bold;
        }
        
        .selected-day {
            background: #ff922b;
            color: white;
            font-weight: bold;
        }
        
        .has-tasks::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 6px;
            height: 6px;
            background: #40c057;
            border-radius: 50%;
        }
        
        .other-month {
            color: #adb5bd;
        }
        
        .holiday {
            color: #e03131;
            font-weight: bold;
        }
        
        .holiday-name {
            font-size: 0.6rem;
            margin-top: 2px;
            line-height: 1;
            text-align: center;
        }
        
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .selected-date {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3b5bdb;
        }
        
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .task-input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .task-input:focus {
            outline: none;
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.2);
        }
        
        .status-select {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }
        
        .add-btn {
            background: #40c057;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .add-btn:hover {
            background: #2f9e44;
            transform: translateY(-2px);
        }
        
        .tasks-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .task-item {
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s;
            border-right: 4px solid #4c6ef5;
        }
        
        .task-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .task-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .status-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-done {
            background: #40c057;
            color: white;
        }
        
        .status-in-progress {
            background: #ffd43b;
            color: #333;
        }
        
        .status-paused {
            background: #ff6b6b;
            color: white;
        }
        
        .status-pending {
            background: #adb5bd;
            color: white;
        }
        
        .delete-btn {
            background: #fa5252;
            color: white;
            border: none;
            border-radius: 5px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .delete-btn:hover {
            background: #e03131;
            transform: scale(1.1);
        }
        
        .task-notes {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border: 1px solid #e9ecef;
            font-size: 14px;
            color: #495057;
        }
        
        .notes-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            margin-top: 5px;
        }
        
        .save-notes-btn {
            background: #4c6ef5;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            margin-top: 5px;
            font-size: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #868e96;
        }
        
        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
            color: #adb5bd;
        }
        
        .progress-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .progress-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #3b5bdb;
        }
        
        .progress-percent {
            font-size: 1.5rem;
            font-weight: bold;
            color: #40c057;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #40c057, #69db7c);
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .progress-stats {
            display: flex;
            justify-content: space-between;
            color: #495057;
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4c6ef5;
        }
        
        .stat-label {
            color: #495057;
            margin-top: 5px;
        }

        /* استایل‌های جدید برای مدیریت داده */
        .data-management {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .data-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .export-btn {
            background: #4c6ef5;
            color: white;
        }

        .import-btn {
            background: #ff922b;
            color: white;
        }

        .clear-btn {
            background: #fa5252;
            color: white;
        }

        .data-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .file-input {
            display: none;
        }

        .section-title {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f8f9fa;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 20px;
            }
            
            .task-actions {
                flex-direction: column;
            }

            .data-management {
                grid-template-columns: 1fr;
            }
        }
    </style>
    
    <!-- بارگذاری کتابخانه‌های مورد نیاز -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-jalaali@0.9.1/build/moment-jalaali.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 برنامه ریزی شخصی من</h1>
            <p>این سایت توسط آریو مقتدر طراحی و کد نویسی شده</p>
        </header>
        
        <div class="progress-section">
            <div class="progress-header">
                <div class="progress-title">پیشرفت کلی</div>
                <div class="progress-percent" id="progressPercent">0%</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <div>انجام شده: <span id="doneCount">0</span></div>
                <div>در دست اقدام: <span id="inProgressCount">0</span></div>
                <div>متوقف شده: <span id="pausedCount">0</span></div>
                <div>در انتظار: <span id="pendingCount">0</span></div>
            </div>
        </div>

        <!-- بخش مدیریت داده -->
        <div class="progress-section">
            <h3 class="section-title">💾 مدیریت داده‌ها</h3>
            <div class="data-management">
                <button class="data-btn export-btn" onclick="exportData()">
                    📥 خروجی گرفتن
                </button>
                <button class="data-btn import-btn" onclick="document.getElementById('importFile').click()">
                    📤 وارد کردن داده
                </button>
                <button class="data-btn clear-btn" onclick="clearAllData()">
                    🗑️ حذف همه داده‌ها
                </button>
                <input type="file" id="importFile" class="file-input" accept=".json" onchange="importData(event)">
            </div>
        </div>
        
        <div class="app-container">
            <div class="calendar-section">
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button class="nav-btn prev-year">«</button>
                        <button class="nav-btn prev-month">‹</button>
                    </div>
                    <div class="current-month">فروردین ۱۴۰۳</div>
                    <div class="calendar-nav">
                        <button class="nav-btn next-month">›</button>
                        <button class="nav-btn next-year">»</button>
                    </div>
                </div>
                
                <div class="weekdays">
                    <div>ش</div>
                    <div>ی</div>
                    <div>د</div>
                    <div>س</div>
                    <div>چ</div>
                    <div>پ</div>
                    <div>ج</div>
                </div>
                
                <div class="days-grid" id="daysGrid">
                    <!-- روزهای تقویم توسط جاوااسکریپت پر می‌شوند -->
                </div>
            </div>
            
            <div class="tasks-section">
                <div class="tasks-header">
                    <div class="selected-date" id="selectedDate">امروز: ۱ فروردین ۱۴۰۳</div>
                </div>
                
                <div class="task-form">
                    <input type="text" class="task-input" id="taskInput" placeholder="یک کار جدید وارد کنید...">
                    <select class="status-select" id="statusSelect">
                        <option value="pending">در انتظار</option>
                        <option value="in-progress">در دست اقدام</option>
                        <option value="done">انجام شد</option>
                        <option value="paused">متوقف شده</option>
                    </select>
                    <textarea class="task-input notes-input" id="notesInput" placeholder="یادداشت (اختیاری)"></textarea>
                    <button class="add-btn" id="addTaskBtn">➕ افزودن کار</button>
                </div>
                
                <div class="tasks-list" id="tasksList">
                    <!-- لیست کارها توسط جاوااسکریپت پر می‌شود -->
                </div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">کل کارها</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="todayTasks">0</div>
                <div class="stat-label">کارهای امروز</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="withNotes">0</div>
                <div class="stat-label">کارهای دارای یادداشت</div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #40c057; color: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 1000;"></div>

    <script>
        // داده‌های برنامه
        let tasks = JSON.parse(localStorage.getItem('dailyTasks')) || {};
        let currentDate = moment();
        let currentYear = currentDate.jYear();
        let currentMonth = currentDate.jMonth() + 1; // ماه‌ها از 1 شروع می‌شوند
        let selectedDate = getTodayPersianDate();
        
        // ماه‌های فارسی
        const persianMonths = [
            'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
            'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
        ];
        
        // روزهای هفته
        const weekdays = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
        
        // وضعیت‌های کار
        const statusLabels = {
            'pending': 'در انتظار',
            'in-progress': 'در دست اقدام',
            'done': 'انجام شد',
            'paused': 'متوقف شده'
        };
        
        const statusColors = {
            'pending': 'status-pending',
            'in-progress': 'status-in-progress',
            'done': 'status-done',
            'paused': 'status-paused'
        };
        
        // مناسبت‌های رسمی ایران (مثال)
        const holidays = {
            '1403/1/1': 'عید نوروز',
            '1403/1/2': 'عید نوروز',
            '1403/1/3': 'عید نوروز',
            '1403/1/4': 'عید نوروز',
            '1403/1/12': 'روز جمهوری اسلامی',
            '1403/1/13': 'سیزده بدر',
            '1403/3/14': 'رحلت امام خمینی',
            '1403/3/15': 'قیام ۱۵ خرداد',
            '1403/11/22': 'پیروزی انقلاب اسلامی',
            '1403/12/29': 'روز ملی شدن صنعت نفت'
        };
        
        // نمایش نوتیفیکیشن
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.background = type === 'success' ? '#40c057' : '#fa5252';
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // خروجی گرفتن از داده‌ها
        function exportData() {
            const dataStr = JSON.stringify(tasks, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `daily_tasks_backup_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            showNotification('داده‌ها با موفقیت export شدند');
        }

        // وارد کردن داده‌ها
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedTasks = JSON.parse(e.target.result);
                    
                    // اعتبارسنجی داده‌های وارد شده
                    if (typeof importedTasks === 'object' && importedTasks !== null) {
                        if (confirm(`آیا می‌خواهید داده‌ها را وارد کنید؟ داده‌های فعلی جایگزین می‌شوند.`)) {
                            tasks = importedTasks;
                            saveTasks();
                            renderTasks();
                            updateStats();
                            updateProgress();
                            generateCalendar(currentYear, currentMonth);
                            showNotification('داده‌ها با موفقیت import شدند');
                        }
                    } else {
                        showNotification('فایل انتخاب شده معتبر نیست', 'error');
                    }
                } catch (error) {
                    showNotification('خطا در خواندن فایل', 'error');
                    console.error('Error importing data:', error);
                }
            };
            reader.readAsText(file);
            
            // ریست کردن input فایل
            event.target.value = '';
        }

        // حذف همه داده‌ها
        function clearAllData() {
            if (confirm('آیا از حذف تمام داده‌ها مطمئن هستید؟ این عمل قابل بازگشت نیست!')) {
                tasks = {};
                localStorage.removeItem('dailyTasks');
                renderTasks();
                updateStats();
                updateProgress();
                generateCalendar(currentYear, currentMonth);
                showNotification('تمامی داده‌ها حذف شدند');
            }
        }
        
        // دریافت تاریخ امروز به شمسی
        function getTodayPersianDate() {
            const today = moment();
            return `${today.jYear()}/${today.jMonth() + 1}/${today.jDate()}`;
        }
        
        // فرمت‌بندی تاریخ برای نمایش
        function formatPersianDate(dateStr) {
            const [y, m, d] = dateStr.split('/').map(Number);
            return `${d} ${persianMonths[m-1]} ${y}`;
        }
        
        // بررسی تعطیلی روز
        function isHoliday(dateStr) {
            return holidays[dateStr] || false;
        }
        
        // بررسی آخر هفته (جمعه)
        function isWeekend(dateStr) {
            const [y, m, d] = dateStr.split('/').map(Number);
            const date = moment(`${y}/${m}/${d}`, 'jYYYY/jM/jD');
            return date.day() === 5; // 5 = جمعه
        }
        
        // تعداد روزهای ماه شمسی
        function getDaysInJalaliMonth(year, month) {
            if (month <= 6) return 31;
            if (month <= 11) return 30;
            // اسفند - بررسی سال کبیسه
            return moment.jIsLeapYear(year) ? 30 : 29;
        }
        
        // تولید تقویم برای ماه و سال مشخص
        function generateCalendar(year, month) {
            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';
            
            // تعداد روزهای ماه
            const daysInMonth = getDaysInJalaliMonth(year, month);
            
            // روز اول ماه شمسی
            const firstDay = moment(`${year}/${month}/1`, 'jYYYY/jM/jD');
            
            // روز هفته برای روز اول ماه (0=شنبه, 1=یکشنبه, ...)
            let firstDayOfWeek = firstDay.day();
            
            // روزهای ماه قبل
            let prevMonth = month - 1;
            let prevYear = year;
            if (prevMonth < 1) {
                prevMonth = 12;
                prevYear = year - 1;
            }
            const prevMonthDays = getDaysInJalaliMonth(prevYear, prevMonth);
            
            // اضافه کردن روزهای ماه قبل
            for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day other-month';
                dayElement.textContent = prevMonthDays - i;
                daysGrid.appendChild(dayElement);
            }
            
            // اضافه کردن روزهای ماه جاری
            const todayPersian = getTodayPersianDate();
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                const dateStr = `${year}/${month}/${day}`;
                dayElement.className = 'day';
                dayElement.innerHTML = `<div>${day}</div>`;
                dayElement.dataset.date = dateStr;
                
                // بررسی تعطیلات
                const holidayName = isHoliday(dateStr);
                const isWeekendDay = isWeekend(dateStr);
                
                if (holidayName) {
                    dayElement.classList.add('holiday');
                    dayElement.innerHTML += `<div class="holiday-name">${holidayName}</div>`;
                } else if (isWeekendDay) {
                    dayElement.classList.add('holiday');
                    dayElement.innerHTML += `<div class="holiday-name">جمعه</div>`;
                }
                
                // اگر روز امروز است
                if (dateStr === todayPersian) {
                    dayElement.classList.add('current-day');
                }
                
                // اگر روز انتخاب شده است
                if (dateStr === selectedDate) {
                    dayElement.classList.add('selected-day');
                }
                
                // اگر برای این روز کاری وجود دارد
                if (tasks[dateStr] && tasks[dateStr].length > 0) {
                    dayElement.classList.add('has-tasks');
                }
                
                dayElement.addEventListener('click', () => selectDate(dateStr));
                daysGrid.appendChild(dayElement);
            }
            
            // اضافه کردن روزهای ماه بعد
            const totalCells = 42; // 6 ردیف * 7 ستون
            const remainingCells = totalCells - (firstDayOfWeek + daysInMonth);
            
            for (let day = 1; day <= remainingCells; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day other-month';
                dayElement.textContent = day;
                daysGrid.appendChild(dayElement);
            }
            
            // به‌روزرسانی هدر تقویم
            document.querySelector('.current-month').textContent = `${persianMonths[month-1]} ${year}`;
        }
        
        // انتخاب تاریخ
        function selectDate(dateStr) {
            selectedDate = dateStr;
            document.getElementById('selectedDate').textContent = formatPersianDate(dateStr);
            generateCalendar(currentYear, currentMonth);
            renderTasks();
            updateStats();
            updateProgress();
        }
        
        // نمایش کارهای تاریخ انتخاب شده
        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            const dateTasks = tasks[selectedDate] || [];
            
            if (dateTasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <i>📝</i>
                        <p>هیچ کاری برای این تاریخ ثبت نشده است</p>
                        <p>کار جدیدی اضافه کنید</p>
                    </div>
                `;
                return;
            }
            
            tasksList.innerHTML = '';
            
            dateTasks.forEach((task, index) => {
                const taskElement = document.createElement('div');
                taskElement.className = 'task-item';
                taskElement.innerHTML = `
                    <div class="task-header">
                        <div class="task-text">${task.text}</div>
                        <div class="task-actions">
                            <button class="status-btn ${statusColors[task.status]}">${statusLabels[task.status]}</button>
                            <button class="delete-btn">×</button>
                        </div>
                    </div>
                    ${task.notes ? `<div class="task-notes">${task.notes}</div>` : ''}
                    <div>
                        <textarea class="notes-input" placeholder="یادداشت جدید...">${task.notes || ''}</textarea>
                        <button class="save-notes-btn" data-index="${index}">ذخیره یادداشت</button>
                    </div>
                `;
                
                // رویداد تغییر وضعیت
                const statusBtn = taskElement.querySelector('.status-btn');
                statusBtn.addEventListener('click', () => changeStatus(index));
                
                // رویداد حذف
                const deleteBtn = taskElement.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', () => deleteTask(index));
                
                // رویداد ذخیره یادداشت
                const saveNotesBtn = taskElement.querySelector('.save-notes-btn');
                saveNotesBtn.addEventListener('click', (e) => {
                    const notesIndex = parseInt(e.target.dataset.index);
                    const notesText = taskElement.querySelector('.notes-input').value;
                    saveNotes(notesIndex, notesText);
                });
                
                tasksList.appendChild(taskElement);
            });
        }
        
        // تغییر وضعیت کار
        function changeStatus(index) {
            const statusOrder = ['pending', 'in-progress', 'done', 'paused'];
            const currentStatus = tasks[selectedDate][index].status;
            const currentIndex = statusOrder.indexOf(currentStatus);
            const nextIndex = (currentIndex + 1) % statusOrder.length;
            tasks[selectedDate][index].status = statusOrder[nextIndex];
            
            saveTasks();
            renderTasks();
            generateCalendar(currentYear, currentMonth);
            updateStats();
            updateProgress();
        }
        
        // ذخیره یادداشت
        function saveNotes(index, notes) {
            tasks[selectedDate][index].notes = notes;
            saveTasks();
            renderTasks();
            updateStats();
        }
        
        // اضافه کردن کار جدید
        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const statusSelect = document.getElementById('statusSelect');
            const notesInput = document.getElementById('notesInput');
            
            const text = taskInput.value.trim();
            const status = statusSelect.value;
            const notes = notesInput.value.trim();
            
            if (text === '') return;
            
            if (!tasks[selectedDate]) {
                tasks[selectedDate] = [];
            }
            
            tasks[selectedDate].push({
                text,
                status,
                notes
            });
            
            taskInput.value = '';
            notesInput.value = '';
            statusSelect.value = 'pending';
            
            saveTasks();
            generateCalendar(currentYear, currentMonth);
            renderTasks();
            updateStats();
            updateProgress();
        }
        
        // حذف کار
        function deleteTask(index) {
            if (confirm('آیا از حذف این کار مطمئن هستید؟')) {
                tasks[selectedDate].splice(index, 1);
                
                // اگر آرایه کارها خالی شد، کلید را حذف کن
                if (tasks[selectedDate].length === 0) {
                    delete tasks[selectedDate];
                }
                
                saveTasks();
                generateCalendar(currentYear, currentMonth);
                renderTasks();
                updateStats();
                updateProgress();
            }
        }
        
        // ذخیره کارها در localStorage
        function saveTasks() {
            localStorage.setItem('dailyTasks', JSON.stringify(tasks));
            console.log('داده‌ها در localStorage ذخیره شد:', tasks);
        }
        
        // به‌روزرسانی آمار
        function updateStats() {
            let total = 0;
            let today = 0;
            let withNotes = 0;
            
            const todayStr = getTodayPersianDate();
            
            for (const date in tasks) {
                const dateTasks = tasks[date];
                total += dateTasks.length;
                
                if (date === todayStr) {
                    today += dateTasks.length;
                }
                
                // شمارش کارهای دارای یادداشت
                withNotes += dateTasks.filter(task => task.notes && task.notes.trim() !== '').length;
            }
            
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('todayTasks').textContent = today;
            document.getElementById('withNotes').textContent = withNotes;
        }
        
        // به‌روزرسانی نوار پیشرفت
        function updateProgress() {
            let doneCount = 0;
            let inProgressCount = 0;
            let pausedCount = 0;
            let pendingCount = 0;
            let totalTasks = 0;
            
            for (const date in tasks) {
                const dateTasks = tasks[date];
                totalTasks += dateTasks.length;
                
                dateTasks.forEach(task => {
                    switch(task.status) {
                        case 'done':
                            doneCount++;
                            break;
                        case 'in-progress':
                            inProgressCount++;
                            break;
                        case 'paused':
                            pausedCount++;
                            break;
                        case 'pending':
                            pendingCount++;
                            break;
                    }
                });
            }
            
            // محاسبه درصد پیشرفت
            const progressPercent = totalTasks > 0 ? Math.round((doneCount / totalTasks) * 100) : 0;
            
            document.getElementById('progressPercent').textContent = `${progressPercent}%`;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            
            document.getElementById('doneCount').textContent = doneCount;
            document.getElementById('inProgressCount').textContent = inProgressCount;
            document.getElementById('pausedCount').textContent = pausedCount;
            document.getElementById('pendingCount').textContent = pendingCount;
        }
        
        // راه‌اندازی اولیه
        document.addEventListener('DOMContentLoaded', () => {
            // تنظیم تاریخ جاری
            const today = getTodayPersianDate();
            const [year, month, day] = today.split('/').map(Number);
            currentYear = year;
            currentMonth = month;
            
            // تولید تقویم
            generateCalendar(currentYear, currentMonth);
            
            // نمایش کارهای امروز
            selectDate(today);
            
            // رویدادهای ناوبری تقویم
            document.querySelector('.prev-year').addEventListener('click', () => {
                currentYear--;
                generateCalendar(currentYear, currentMonth);
            });
            
            document.querySelector('.prev-month').addEventListener('click', () => {
                currentMonth--;
                if (currentMonth < 1) {
                    currentMonth = 12;
                    currentYear--;
                }
                generateCalendar(currentYear, currentMonth);
            });
            
            document.querySelector('.next-month').addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 12) {
                    currentMonth = 1;
                    currentYear++;
                }
                generateCalendar(currentYear, currentMonth);
            });
            
            document.querySelector('.next-year').addEventListener('click', () => {
                currentYear++;
                generateCalendar(currentYear, currentMonth);
            });
            
            // رویداد افزودن کار
            document.getElementById('addTaskBtn').addEventListener('click', addTask);
            
            document.getElementById('taskInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            
            // به‌روزرسانی آمار و پیشرفت
            updateStats();
            updateProgress();
        });
    </script>
</body>
</html>
