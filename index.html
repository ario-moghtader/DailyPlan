<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه‌ریزی شخصی من</title>
    <style>
        /* استایل‌های قبلی بدون تغییر */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', Tahoma, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .creator {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .calendar-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .tasks-section {
            flex: 2;
            min-width: 300px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .calendar-nav {
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
            background: #4c6ef5;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .nav-btn:hover {
            background: #3b5bdb;
            transform: scale(1.1);
        }
        
        .current-month {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3b5bdb;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #495057;
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            position: relative;
        }
        
        .day:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }
        
        .current-day {
            background: #4c6ef5;
            color: white;
            font-weight: bold;
        }
        
        .selected-day {
            background: #ff922b;
            color: white;
            font-weight: bold;
        }
        
        .has-tasks::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 6px;
            height: 6px;
            background: #40c057;
            border-radius: 50%;
        }
        
        .has-installment::after {
            content: '';
            position: absolute;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            border-radius: 50%;
        }
        
        .other-month {
            color: #adb5bd;
        }
        
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .selected-date {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3b5bdb;
        }
        
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .task-input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .task-input:focus {
            outline: none;
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.2);
        }
        
        .status-select {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }
        
        .add-btn {
            background: #40c057;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .add-btn:hover {
            background: #2f9e44;
            transform: translateY(-2px);
        }
        
        .tasks-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .task-item {
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s;
            border-right: 4px solid #4c6ef5;
        }
        
        .task-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .task-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .status-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-done {
            background: #40c057;
            color: white;
        }
        
        .status-in-progress {
            background: #ffd43b;
            color: #333;
        }
        
        .status-paused {
            background: #ff6b6b;
            color: white;
        }
        
        .status-pending {
            background: #adb5bd;
            color: white;
        }
        
        .delete-btn {
            background: #fa5252;
            color: white;
            border: none;
            border-radius: 5px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .delete-btn:hover {
            background: #e03131;
            transform: scale(1.1);
        }
        
        .task-notes {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border: 1px solid #e9ecef;
            font-size: 14px;
            color: #495057;
        }
        
        .notes-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            margin-top: 5px;
        }
        
        .save-notes-btn {
            background: #4c6ef5;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            margin-top: 5px;
            font-size: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #868e96;
        }
        
        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
            color: #adb5bd;
        }
        
        .progress-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .progress-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #3b5bdb;
        }
        
        .progress-percent {
            font-size: 1.5rem;
            font-weight: bold;
            color: #40c057;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #40c057, #69db7c);
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .progress-stats {
            display: flex;
            justify-content: space-between;
            color: #495057;
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4c6ef5;
        }
        
        .stat-label {
            color: #495057;
            margin-top: 5px;
        }

        /* استایل‌های جدید برای اقساط */
        .installment-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .installment-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .installment-input {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .installment-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .installment-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #fff3cd;
            border-radius: 10px;
            border-right: 4px solid #ffc107;
        }

        .installment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .installment-title {
            font-weight: bold;
            color: #856404;
        }

        .installment-date {
            color: #666;
            font-size: 14px;
        }

        .installment-details {
            color: #666;
            font-size: 14px;
        }

        .upcoming-installment {
            background: #d4edda;
            border-right-color: #28a745;
        }

        .upcoming-installment .installment-title {
            color: #155724;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 20px;
            }
            
            .task-actions {
                flex-direction: column;
            }

            .installment-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 برنامه ریزی شخصی من</h1>
            <p>این سایت توسط آریو مقتدر طراحی و کد نویسی شده</p>
        </header>
        
        <!-- بخش اقساط -->
        <div class="installment-section">
            <h3>💳 مدیریت اقساط</h3>
            <div class="installment-form">
                <input type="text" class="installment-input" id="installmentName" placeholder="نام قسط (مثال: وام بانک)">
                <input type="number" class="installment-input" id="installmentDay" placeholder="روز ماه (۱-۳۱)" min="1" max="31">
                <input type="number" class="installment-input" id="installmentMonths" placeholder="تعداد ماه‌ها" min="1" max="120">
                <button class="add-btn" onclick="addInstallment()">➕ افزودن قسط</button>
            </div>
            <div class="installment-list" id="installmentList">
                <!-- لیست اقساط اینجا نمایش داده می‌شود -->
            </div>
        </div>
        
        <div class="progress-section">
            <div class="progress-header">
                <div class="progress-title">پیشرفت کلی</div>
                <div class="progress-percent" id="progressPercent">0%</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <div>انجام شده: <span id="doneCount">0</span></div>
                <div>در دست اقدام: <span id="inProgressCount">0</span></div>
                <div>متوقف شده: <span id="pausedCount">0</span></div>
                <div>در انتظار: <span id="pendingCount">0</span></div>
            </div>
        </div>
        
        <div class="app-container">
            <div class="calendar-section">
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button class="nav-btn prev-year">«</button>
                        <button class="nav-btn prev-month">‹</button>
                    </div>
                    <div class="current-month">فروردین ۱۴۰۳</div>
                    <div class="calendar-nav">
                        <button class="nav-btn next-month">›</button>
                        <button class="nav-btn next-year">»</button>
                    </div>
                </div>
                
                <div class="weekdays">
                    <div>ش</div>
                    <div>ی</div>
                    <div>د</div>
                    <div>س</div>
                    <div>چ</div>
                    <div>پ</div>
                    <div>ج</div>
                </div>
                
                <div class="days-grid" id="daysGrid">
                    <!-- روزهای تقویم توسط جاوااسکریپت پر می‌شوند -->
                </div>
            </div>
            
            <div class="tasks-section">
                <div class="tasks-header">
                    <div class="selected-date" id="selectedDate">امروز: ۱ فروردین ۱۴۰۳</div>
                </div>
                
                <div class="task-form">
                    <input type="text" class="task-input" id="taskInput" placeholder="یک کار جدید وارد کنید...">
                    <select class="status-select" id="statusSelect">
                        <option value="pending">در انتظار</option>
                        <option value="in-progress">در دست اقدام</option>
                        <option value="done">انجام شد</option>
                        <option value="paused">متوقف شده</option>
                    </select>
                    <textarea class="task-input notes-input" id="notesInput" placeholder="یادداشت (اختیاری)"></textarea>
                    <button class="add-btn" id="addTaskBtn">➕ افزودن کار</button>
                </div>
                
                <div class="tasks-list" id="tasksList">
                    <!-- لیست کارها توسط جاوااسکریپت پر می‌شود -->
                </div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">کل کارها</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="todayTasks">0</div>
                <div class="stat-label">کارهای امروز</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="withNotes">0</div>
                <div class="stat-label">کارهای دارای یادداشت</div>
            </div>
        </div>
    </div>

    <script>
        // داده‌های برنامه
        let tasks = JSON.parse(localStorage.getItem('dailyTasks')) || {};
        let installments = JSON.parse(localStorage.getItem('installments')) || [];
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth();
        let selectedDate = getTodayPersianDate();
        
        // ماه‌های فارسی
        const persianMonths = [
            'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
            'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
        ];
        
        // روزهای هفته
        const weekdays = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
        
        // وضعیت‌های کار
        const statusLabels = {
            'pending': 'در انتظار',
            'in-progress': 'در دست اقدام',
            'done': 'انجام شد',
            'paused': 'متوقف شده'
        };
        
        const statusColors = {
            'pending': 'status-pending',
            'in-progress': 'status-in-progress',
            'done': 'status-done',
            'paused': 'status-paused'
        };
        
        // تبدیل تاریخ میلادی به شمسی
        function gregorianToJalali(gy, gm, gd) {
            let g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            let jy = (gy <= 1600) ? 0 : 979;
            gy -= (gy <= 1600) ? 621 : 1600;
            let gy2 = (gm > 2) ? (gy + 1) : gy;
            let days = (365 * gy) + (parseInt((gy2 + 3) / 4)) - (parseInt((gy2 + 99) / 100)) 
                      + (parseInt((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
            jy += 33 * (parseInt(days / 12053));
            days %= 12053;
            jy += 4 * (parseInt(days / 1461));
            days %= 1461;
            jy += parseInt((days - 1) / 365);
            if (days > 365) days = (days - 1) % 365;
            let jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
            let jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
            return [jy, jm, jd];
        }
        
        // تبدیل تاریخ شمسی به میلادی
        function jalaliToGregorian(jy, jm, jd) {
            jy += 1595;
            let days = -355668 + (365 * jy) + (parseInt(jy / 33) * 8) + parseInt(((jy % 33) + 3) / 4) 
                      + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
            let gy = 400 * parseInt(days / 146097);
            days %= 146097;
            if (days > 36524) {
                gy += 100 * parseInt(--days / 36524);
                days %= 36524;
                if (days >= 365) days++;
            }
            gy += 4 * parseInt(days / 1461);
            days %= 1461;
            if (days > 365) {
                gy += parseInt((days - 1) / 365);
                days = (days - 1) % 365;
            }
            let gd = days + 1;
            let sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let gm;
            for (gm = 0; gm < 13; gm++) {
                let v = sal_a[gm];
                if (gd <= v) break;
                gd -= v;
            }
            return [gy, gm, gd];
        }
        
        // دریافت تاریخ امروز به شمسی
        function getTodayPersianDate() {
            const today = new Date();
            const [jy, jm, jd] = gregorianToJalali(
                today.getFullYear(), 
                today.getMonth() + 1, 
                today.getDate()
            );
            return `${jy}/${jm}/${jd}`;
        }
        
        // فرمت‌بندی تاریخ برای نمایش
        function formatPersianDate(dateStr) {
            const [y, m, d] = dateStr.split('/').map(Number);
            return `${d} ${persianMonths[m-1]} ${y}`;
        }

        // محاسبه تاریخ‌های اقساط
        function calculateInstallmentDates(day, totalMonths) {
            const dates = [];
            const today = new Date();
            const [currentYear, currentMonth, currentDay] = getTodayPersianDate().split('/').map(Number);
            
            for (let i = 0; i < totalMonths; i++) {
                let year = currentYear;
                let month = currentMonth + i;
                
                // محاسبه سال و ماه
                while (month > 12) {
                    month -= 12;
                    year += 1;
                }
                
                // بررسی اینکه روز مورد نظر در ماه وجود دارد
                const lastDayOfMonth = new Date(jalaliToGregorian(year, month + 1, 0)).getDate();
                const actualDay = Math.min(day, lastDayOfMonth);
                
                dates.push({
                    year: year,
                    month: month,
                    day: actualDay,
                    dateStr: `${year}/${month}/${actualDay}`,
                    displayDate: `${actualDay} ${persianMonths[month-1]} ${year}`
                });
            }
            
            return dates;
        }

        // افزودن قسط جدید
        function addInstallment() {
            const nameInput = document.getElementById('installmentName');
            const dayInput = document.getElementById('installmentDay');
            const monthsInput = document.getElementById('installmentMonths');
            
            const name = nameInput.value.trim();
            const day = parseInt(dayInput.value);
            const months = parseInt(monthsInput.value);
            
            if (!name || !day || !months || day < 1 || day > 31 || months < 1) {
                alert('لطفاً تمام فیلدها را به درستی پر کنید');
                return;
            }
            
            const installmentDates = calculateInstallmentDates(day, months);
            
            installments.push({
                id: Date.now(),
                name: name,
                day: day,
                totalMonths: months,
                dates: installmentDates,
                createdAt: new Date().toISOString()
            });
            
            saveInstallments();
            renderInstallments();
            generateCalendar(currentYear, currentMonth);
            
            // پاک کردن فیلدها
            nameInput.value = '';
            dayInput.value = '';
            monthsInput.value = '';
        }

        // نمایش اقساط
        function renderInstallments() {
            const installmentList = document.getElementById('installmentList');
            
            if (installments.length === 0) {
                installmentList.innerHTML = `
                    <div class="empty-state">
                        <i>💳</i>
                        <p>هیچ قسطی ثبت نشده است</p>
                        <p>قسط جدیدی اضافه کنید</p>
                    </div>
                `;
                return;
            }
            
            installmentList.innerHTML = '';
            
            // پیدا کردن قسط بعدی
            const today = getTodayPersianDate();
            let nextInstallment = null;
            
            installments.forEach(installment => {
                const upcomingDates = installment.dates.filter(date => 
                    date.dateStr >= today
                );
                
                if (upcomingDates.length > 0) {
                    const nextDate = upcomingDates[0];
                    if (!nextInstallment || nextDate.dateStr < nextInstallment.date.dateStr) {
                        nextInstallment = {
                            installment: installment,
                            date: nextDate
                        };
                    }
                }
                
                installment.dates.forEach((date, index) => {
                    const isUpcoming = date.dateStr === nextInstallment?.date.dateStr;
                    const installmentElement = document.createElement('div');
                    installmentElement.className = `installment-item ${isUpcoming ? 'upcoming-installment' : ''}`;
                    installmentElement.innerHTML = `
                        <div class="installment-header">
                            <div class="installment-title">${installment.name} - قسط ${index + 1}</div>
                            <div class="installment-date">${date.displayDate}</div>
                        </div>
                        <div class="installment-details">
                            ${isUpcoming ? '🔔 قسط بعدی' : '✅ قسط گذشته'}
                        </div>
                    `;
                    installmentList.appendChild(installmentElement);
                });
            });
        }

        // ذخیره اقساط
        function saveInstallments() {
            localStorage.setItem('installments', JSON.stringify(installments));
        }
        
        // تولید تقویم برای ماه و سال مشخص
        function generateCalendar(year, month) {
            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';
            
            // روز اول ماه شمسی
            const firstDay = new Date(jalaliToGregorian(year, month, 1));
            
            // روز آخر ماه شمسی
            const lastDay = new Date(jalaliToGregorian(year, month + 1, 0));
            const daysInMonth = lastDay.getDate();
            
            // روز هفته برای روز اول ماه (0=شنبه, 1=یکشنبه, ...)
            let firstDayOfWeek = firstDay.getDay() + 1; // تبدیل به فرمت ایرانی
            if (firstDayOfWeek === 7) firstDayOfWeek = 0;
            
            // روزهای ماه قبل
            const prevMonthLastDay = new Date(jalaliToGregorian(year, month, 0));
            const prevMonthDays = prevMonthLastDay.getDate();
            
            // اضافه کردن روزهای ماه قبل
            for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day other-month';
                dayElement.textContent = prevMonthDays - i;
                daysGrid.appendChild(dayElement);
            }
            
            // اضافه کردن روزهای ماه جاری
            const todayPersian = getTodayPersianDate();
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                const dateStr = `${year}/${month}/${day}`;
                dayElement.className = 'day';
                dayElement.textContent = day;
                dayElement.dataset.date = dateStr;
                
                // اگر روز امروز است
                if (dateStr === todayPersian) {
                    dayElement.classList.add('current-day');
                }
                
                // اگر روز انتخاب شده است
                if (dateStr === selectedDate) {
                    dayElement.classList.add('selected-day');
                }
                
                // اگر برای این روز کاری وجود دارد
                if (tasks[dateStr] && tasks[dateStr].length > 0) {
                    dayElement.classList.add('has-tasks');
                }
                
                // اگر برای این روز قسطی وجود دارد
                const hasInstallment = installments.some(installment =>
                    installment.dates.some(date => date.dateStr === dateStr)
                );
                if (hasInstallment) {
                    dayElement.classList.add('has-installment');
                }
                
                dayElement.addEventListener('click', () => selectDate(dateStr));
                daysGrid.appendChild(dayElement);
            }
            
            // اضافه کردن روزهای ماه بعد
            const totalCells = 42; // 6 ردیف * 7 ستون
            const remainingCells = totalCells - (firstDayOfWeek + daysInMonth);
            
            for (let day = 1; day <= remainingCells; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day other-month';
                dayElement.textContent = day;
                daysGrid.appendChild(dayElement);
            }
            
            // به‌روزرسانی هدر تقویم
            document.querySelector('.current-month').textContent = `${persianMonths[month-1]} ${year}`;
        }
        
        // انتخاب تاریخ
        function selectDate(dateStr) {
            selectedDate = dateStr;
            document.getElementById('selectedDate').textContent = formatPersianDate(dateStr);
            generateCalendar(currentYear, currentMonth);
            renderTasks();
            updateStats();
            updateProgress();
        }
        
        // نمایش کارهای تاریخ انتخاب شده
        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            const dateTasks = tasks[selectedDate] || [];
            
            if (dateTasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <i>📝</i>
                        <p>هیچ کاری برای این تاریخ ثبت نشده است</p>
                        <p>کار جدیدی اضافه کنید</p>
                    </div>
                `;
                return;
            }
            
            tasksList.innerHTML = '';
            
            dateTasks.forEach((task, index) => {
                const taskElement = document.createElement('div');
                taskElement.className = 'task-item';
                taskElement.innerHTML = `
                    <div class="task-header">
                        <div class="task-text">${task.text}</div>
                        <div class="task-actions">
                            <button class="status-btn ${statusColors[task.status]}">${statusLabels[task.status]}</button>
                            <button class="delete-btn">×</button>
                        </div>
                    </div>
                    ${task.notes ? `<div class="task-notes">${task.notes}</div>` : ''}
                    <div>
                        <textarea class="notes-input" placeholder="یادداشت جدید...">${task.notes || ''}</textarea>
                        <button class="save-notes-btn" data-index="${index}">ذخیره یادداشت</button>
                    </div>
                `;
                
                // رویداد تغییر وضعیت
                const statusBtn = taskElement.querySelector('.status-btn');
                statusBtn.addEventListener('click', () => changeStatus(index));
                
                // رویداد حذف
                const deleteBtn = taskElement.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', () => deleteTask(index));
                
                // رویداد ذخیره یادداشت
                const saveNotesBtn = taskElement.querySelector('.save-notes-btn');
                saveNotesBtn.addEventListener('click', (e) => {
                    const notesIndex = parseInt(e.target.dataset.index);
                    const notesText = taskElement.querySelector('.notes-input').value;
                    saveNotes(notesIndex, notesText);
                });
                
                tasksList.appendChild(taskElement);
            });
        }
        
        // تغییر وضعیت کار
        function changeStatus(index) {
            const statusOrder = ['pending', 'in-progress', 'done', 'paused'];
            const currentStatus = tasks[selectedDate][index].status;
            const currentIndex = statusOrder.indexOf(currentStatus);
            const nextIndex = (currentIndex + 1) % statusOrder.length;
            tasks[selectedDate][index].status = statusOrder[nextIndex];
            
            saveTasks();
            renderTasks();
            generateCalendar(currentYear, currentMonth);
            updateStats();
            updateProgress();
        }
        
        // ذخیره یادداشت
        function saveNotes(index, notes) {
            tasks[selectedDate][index].notes = notes;
            saveTasks();
            renderTasks();
            updateStats();
        }

            notesInput.value = '';

            saveTasks();
            generateCalendar(currentYear, currentMonth);
            renderTasks();
            updateStats();
            updateProgress();
        }
